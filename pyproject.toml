[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "suede-ai"
version = "0.1.0"
description = "Python SDK for Suede AI — x402 pay-per-call music generation, stem splitting, MIDI, mastering, and IP-registry lookups settled in USDC on Base. No API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jason Colapietro", email = "jasoncola1@gmail.com" },
]
maintainers = [
    { name = "Jason Colapietro", email = "jasoncola1@gmail.com" },
]
keywords = [
    "suede",
    "suede-ai",
    "x402",
    "agent-commerce",
    "micropayments",
    "usdc",
    "base",
    "music-generation",
    "ai-music",
    "stem-splitting",
    "midi-transcription",
    "eip-3009",
    "web3",
    "agent",
    "programmable-ip",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
    "eth-account>=0.10",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://suedeai.ai"
Documentation = "https://github.com/Suede-AI/suede-sdk-python#readme"
Repository = "https://github.com/Suede-AI/suede-sdk-python"
Issues = "https://github.com/Suede-AI/suede-sdk-python/issues"
Changelog = "https://github.com/Suede-AI/suede-sdk-python/releases"
"x402 manifest" = "https://app.suedeai.ai/.well-known/x402.json"

[tool.hatch.build.targets.wheel]
packages = ["src/suede_ai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
